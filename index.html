<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Code Lookup</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, Arial;
    background: #f5f5f7;
    padding: 20px;
}

.container {
    max-width: 400px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1 {
    text-align:center;
}

input {
    width:100%;
    padding:15px;
    font-size:20px;
    border-radius:12px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button {
    width:100%;
    margin-top:15px;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#007aff;
    color:white;
}

.result {
    margin-top:20px;
    padding:15px;
    background:#f0f0f0;
    border-radius:15px;
    font-size:18px;
}

.error {
    color:red;
}
</style>

</head>

<body>

<div class="container">

<h1>Code Lookup</h1>

<input id="codeInput" placeholder="Enter code">

<button onclick="searchCode()">
Search
</button>

<div id="result" class="result">
Load database...
</div>

</div>


<script>

let database = [];


/* Load Excel file */

fetch("database.xlsx")
.then(response => response.arrayBuffer())
.then(data => {

    let workbook = XLSX.read(data);

    let sheet = workbook.Sheets[workbook.SheetNames[0]];

    database = XLSX.utils.sheet_to_json(sheet);

    document.getElementById("result").innerHTML =
    "Database loaded: " + database.length + " items";

})
.catch(error=>{

    document.getElementById("result").innerHTML =
    "<span class='error'>Could not load database</span>";

});



function searchCode(){

    let code =
    document.getElementById("codeInput").value.trim();


    let found =
    database.find(item =>
        String(item.Code) === code
    );


    if(found){

        document.getElementById("result").innerHTML =
        `
        <b>Code:</b> ${found.Code}
        <br><br>
        <b>Item:</b><br>
        ${found.Item}
        `;

    }
    else{

        document.getElementById("result").innerHTML =
        `
        <span class="error">
        Code not found
        </span>
        `;

    }

}

</script>

</body>
</html>
