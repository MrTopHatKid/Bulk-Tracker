<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulk Barn Code Lookup</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<style>

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial;
    background: #f5f5f7;
    padding: 20px;
}


.container {

    max-width:450px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);

}


h1 {

    text-align:center;
    font-size:28px;

}


input {

    width:100%;
    padding:15px;
    font-size:22px;
    border-radius:12px;
    border:1px solid #ccc;
    box-sizing:border-box;

}



button {

    width:100%;
    margin-top:15px;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:12px;
    background:#007aff;
    color:white;
    cursor:pointer;

}


button:hover {

    opacity:.85;

}



.result {

    margin-top:20px;
    padding:20px;
    background:#f2f2f2;
    border-radius:15px;
    font-size:18px;

}


.error {

    color:red;

}


.label {

    font-weight:bold;

}

</style>


</head>


<body>


<div class="container">


<h1>
Bulk Barn Lookup
</h1>


<input 
id="codeInput"
placeholder="Enter Code"
type="number">


<button onclick="searchCode()">
Search
</button>


<div id="result" class="result">

Loading database...

</div>


</div>




<script>


let database = [];



// Load Excel Database

fetch("Reformatted_Bulk_Barn_2026-08-06.xlsx")

.then(response => response.arrayBuffer())

.then(data => {


    let workbook = XLSX.read(data);


    let sheet = workbook.Sheets[workbook.SheetNames[0]];


    database = XLSX.utils.sheet_to_json(sheet, {

        defval:""

    });



    console.log(database);



    document.getElementById("result").innerHTML =

    "Database Loaded<br>" +

    database.length +

    " products available";


})


.catch(error => {


    document.getElementById("result").innerHTML =

    "<span class='error'>Unable to load Excel file</span>";


});





function searchCode(){


    let code = 

    document.getElementById("codeInput").value.trim();



    if(code === ""){


        document.getElementById("result").innerHTML =

        "<span class='error'>Please enter a code</span>";

        return;

    }




    let found = database.find(item =>


        String(item.Code).trim() === code


    );





    if(found){


        document.getElementById("result").innerHTML =

        `

        <div>

        <span class="label">
        Category:
        </span>
        <br>

        ${found.Category}


        <br><br>


        <span class="label">
        Item:
        </span>

        <br>

        ${found["Item Name"]}


        <br><br>


        <span class="label">
        Code:
        </span>

        <br>

        ${found.Code}


        </div>

        `;


    }

    else {


        document.getElementById("result").innerHTML =


        `

        <span class="error">

        Code ${code} was not found

        </span>

        `;


    }


}



</script>


</body>

</html>
